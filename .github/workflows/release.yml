name: Build and Release AAR

on:
  push:
    branches:
      - main
    paths:
      - 'engine/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  pull_request:
    branches:
      - main
    paths:
      - 'engine/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Enable KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm
          sudo usermod -aG kvm $USER
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run UI Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 8G
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew :test_sample_app_for_engine:connectedDebugAndroidTest

      - name: Build AAR
        run: ./gradlew :engine:assembleRelease

      - name: Extract Version
        id: get_version
        run: |
          # Extracts the version string from the publishing block in engine/build.gradle.kts
          VERSION=$(grep "version =" engine/build.gradle.kts | head -1 | awk -F'"' '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: Release v${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.VERSION, 'alpha') || contains(steps.get_version.outputs.VERSION, 'beta') }}
          files: engine/build/outputs/aar/engine-release.aar
          body_path: release_notes_v0.0.2.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ping JitPack
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Trigger JitPack to start building the new release automatically
          TAG_NAME="v${{ steps.get_version.outputs.VERSION }}"
          echo "Pinging JitPack for $TAG_NAME..."
          curl -s "https://jitpack.io/api/builds/com.github.rajbirsehmi/UI-Engine/$TAG_NAME" > /dev/null
